name: api

on:
  push:
    paths: ["apps/api/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["apps/api/**", ".github/workflows/api.yml"]

defaults:
  run:
    working-directory: apps/api

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workbench
          POSTGRES_PASSWORD: workbench
          POSTGRES_DB: workbench
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workbench"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://workbench:workbench@localhost:5432/workbench
      JWT_SECRET: ci-secret-value-at-least-32-bytes-long
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Migrations apply cleanly and match models
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Tests (SQLite)
        run: uv run pytest -q

      - name: Tests (PostgreSQL)
        # The same suite against the real engine. SQLite is not PostgreSQL:
        # a snapshot save that INSERTed charts before the queries they
        # reference passed on SQLite and failed on PostgreSQL every time.
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://workbench:workbench@localhost:5432/workbench
        run: uv run pytest -q

      - name: Dependency audit
        # Advisory: a new CVE disclosure shouldn't block an unrelated PR, but it
        # should be visible in the run.
        continue-on-error: true
        run: uvx pip-audit --strict --progress-spinner off
