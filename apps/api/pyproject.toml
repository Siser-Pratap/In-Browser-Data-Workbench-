[project]
name = "workbench-api"
version = "0.1.0"
description = "FastAPI backend for the In-Browser Data Workbench (AI Phase 1: NL->SQL)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-genai>=1.0",
    "sqlglot>=25.0",
    "pydantic-settings>=2.4",
    "pydantic[email]>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "boto3>=1.35",
    # Server-side compute (Phase 3): DuckDB reads S3 directly, results ship as Arrow.
    "duckdb>=1.0",
    "pyarrow>=17.0",
    "arq>=0.26",
    "prometheus-client>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The project is not installed as a package (`[tool.uv] package = false`), so
# put the source root on sys.path for imports like `from app.core...`.
pythonpath = ["src"]
testpaths = ["tests", "evals"]
markers = [
    "eval: live-model evaluation runs (require GEMINI_API_KEY; run with -m eval)",
    "perf: timing budgets; noisy on shared CI runners (run with -m perf)",
]
addopts = "-m 'not eval and not perf'"

[tool.ruff]
line-length = 100
src = ["src"]
# Alembic revisions are generated/boilerplate; don't enforce line length there.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = false
